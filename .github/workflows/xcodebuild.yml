name: xcodebuild build & test

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, xcode-27]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Set the Xcode version
      run: |
        case "${{ matrix.os }}" in
          "macos-26")
            xcodes select 26.6
            ;;
          "xcode-27")
            xcodes select 27.0
            ;;
        esac
    - name: Version information
      run: swift --version
    - name: List schemes
      run: xcodebuild -list
    - name: Set Default Scheme
      id: set-scheme
      run: |
        scheme_list=$(xcodebuild -list -json | tr -d "\n")
        default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['workspace']['schemes'][0]")
        echo Using default scheme: $default
        echo "scheme=$default" >> $GITHUB_OUTPUT
    - name: Build for testing
      run: xcodebuild build-for-testing -scheme "${{ steps.set-scheme.outputs.scheme }}" -destination "platform=macOS,arch=arm64"
    - name: Run tests
      run: xcodebuild test-without-building -scheme "${{ steps.set-scheme.outputs.scheme }}" -destination "platform=macOS,arch=arm64"
