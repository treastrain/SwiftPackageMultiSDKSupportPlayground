name: swift build & test

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: "${{ matrix.osName }} - Swift ${{ matrix.swift-version }}"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, ubuntu-22.04, windows-2022]
        swift-version: [6.3, 6.4.x-snapshot]
        exclude:
        - os: windows-2022
          swift-version: 6.4.x-snapshot
        include:
        - os: macos-26
          osName: macOS 26
        - os: ubuntu-24.04
          osName: Ubuntu 24.04
        - os: ubuntu-22.04
          osName: Ubuntu 22.04
        - os: windows-2022
          osName: Windows Server 2022
        - swift-version: 6.3
          traitArguments: ""
          windowsToolchainURL: https://download.swift.org/swift-6.3-release/windows10/swift-6.3-RELEASE/swift-6.3-RELEASE-windows10.exe
        - swift-version: 6.4.x-snapshot
          traitArguments: --traits OS_27
    env:
      SWIFT_VERSION: ${{ matrix.swift-version }}
    runs-on: ${{ matrix.os }}
    steps:
    - name: Install Swift toolchain on macOS and Linux
      if: runner.os != 'Windows'
      shell: bash
      run: |
        case "$RUNNER_OS" in
          macOS)
            curl -fL https://download.swift.org/swiftly/darwin/swiftly.pkg -o swiftly.pkg
            installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
            ~/.swiftly/bin/swiftly init -y --skip-install
            ~/.swiftly/bin/swiftly install "${{ matrix.swift-version }}" -u -y
            ~/.swiftly/bin/swiftly link
            echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
            ;;
          Linux)
            sudo apt-get update
            sudo apt-get install -y libcurl4-openssl-dev
            if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
              sudo apt-get install -y pkg-config python3-lldb-13
            fi
            curl -fL "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" -o swiftly.tar.gz
            tar zxf swiftly.tar.gz
            ./swiftly init -y --skip-install
            ~/.local/share/swiftly/bin/swiftly install "${{ matrix.swift-version }}" -u -y
            ~/.local/share/swiftly/bin/swiftly link
            echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"
            ;;
          *)
            echo "Unsupported OS: $RUNNER_OS"
            exit 1
            ;;
        esac
    - name: Install Swift toolchain on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile vc_redist.x64.exe
        $process = Start-Process -FilePath .\vc_redist.x64.exe -ArgumentList "/install", "/quiet", "/norestart" -Wait -PassThru
        if ($process.ExitCode -notin 0, 1638, 3010) {
          throw "Visual C++ Redistributable installer failed with exit code $($process.ExitCode)"
        }

        Invoke-WebRequest -Uri "${{ matrix.windowsToolchainURL }}" -OutFile swift-installer.exe
        $process = Start-Process -FilePath .\swift-installer.exe -ArgumentList "/quiet", "/norestart" -Wait -PassThru
        if ($process.ExitCode -notin 0, 3010) {
          throw "Swift installer failed with exit code $($process.ExitCode)"
        }

        $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
        $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
        ($machinePath, $userPath) -split ";" |
          Where-Object { $_ } |
          ForEach-Object { $_ >> $env:GITHUB_PATH }
        [Environment]::GetEnvironmentVariables("User").GetEnumerator() |
          Where-Object { $_.Key -ne "Path" } |
          ForEach-Object { "$($_.Key)=$($_.Value)" >> $env:GITHUB_ENV }
        $sdkRoot = [Environment]::GetEnvironmentVariable("SDKROOT", "User")
        if (-not $sdkRoot) {
          $sdkRoot = Get-ChildItem "$env:LOCALAPPDATA\Programs\Swift\Platforms" -Directory -Recurse -Filter Windows.sdk |
            Select-Object -First 1 -ExpandProperty FullName
        }
        if (-not $sdkRoot) {
          throw "Windows SDK installed by the Swift toolchain was not found"
        }
        "SDKROOT=$sdkRoot" >> $env:GITHUB_ENV
    - uses: actions/checkout@v7
    - name: Version information
      run: swift --version
    - name: Build
      run: swift build -v ${{ matrix.traitArguments }}
    - name: Run tests
      run: swift test -v ${{ matrix.traitArguments }}

  build-sdk:
    name: "${{ matrix.target.name }} - Swift ${{ matrix.swift-version }}"
    strategy:
      fail-fast: false
      matrix:
        swift-version: [6.3, 6.4.x-snapshot]
        target:
        - name: Android (x86_64)
          bundle: android
          sdk: x86_64-unknown-linux-android28
          build-option: --static-swift-stdlib
          release-checksum: d160cc3206dd1886dae3fef2337af5e25ec034692cd0ec225721c56cc69da7f5
          beta-checksum: c5bb1c4399375c1a59c6aa672f3f81014e111de0d464ada8ae8cc5814ce29681
        - name: Android (aarch64)
          bundle: android
          sdk: aarch64-unknown-linux-android28
          build-option: --static-swift-stdlib
          release-checksum: d160cc3206dd1886dae3fef2337af5e25ec034692cd0ec225721c56cc69da7f5
          beta-checksum: c5bb1c4399375c1a59c6aa672f3f81014e111de0d464ada8ae8cc5814ce29681
        include:
        - swift-version: 6.3
          toolchainVersion: 6.3.3
          sdkBaseURL: https://download.swift.org/swift-6.3.3-release
          sdkRelease: swift-6.3.3-RELEASE
        - swift-version: 6.4.x-snapshot
          toolchainVersion: 6.4.x-DEVELOPMENT-SNAPSHOT-2026-07-23-a
          sdkBaseURL: https://download.swift.org/swift-6.4.x-branch
          sdkRelease: swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-07-23-a
    env:
      SWIFT_CHANNEL: ${{ matrix.swift-version }}
      SWIFT_VERSION: ${{ matrix.toolchainVersion }}
    runs-on: ubuntu-24.04
    steps:
    - name: Install Swift toolchain
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev
        curl -fL "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" -o swiftly.tar.gz
        tar zxf swiftly.tar.gz
        ./swiftly init -y --skip-install
        ~/.local/share/swiftly/bin/swiftly install "$SWIFT_VERSION" -u -y
        ~/.local/share/swiftly/bin/swiftly link
        echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"
    - uses: actions/checkout@v7
    - name: Version information
      run: swift --version
    - name: Install Swift SDK
      shell: bash
      run: |
        BUNDLE="${{ matrix.target.bundle }}"
        case "$BUNDLE" in
          android)
            SDK_DIRECTORY="android-sdk"
            ;;
          *)
            echo "Unsupported SDK bundle: $BUNDLE"
            exit 1
            ;;
        esac
        case "$SWIFT_CHANNEL" in
          6.3)
            CHECKSUM="${{ matrix.target.release-checksum }}"
            ;;
          6.4.x-snapshot)
            CHECKSUM="${{ matrix.target.beta-checksum }}"
            ;;
          *)
            echo "Unsupported Swift channel: $SWIFT_CHANNEL"
            exit 1
            ;;
        esac
        BUNDLE_URL="${{ matrix.sdkBaseURL }}/${SDK_DIRECTORY}/${{ matrix.sdkRelease }}/${{ matrix.sdkRelease }}_${BUNDLE}.artifactbundle.tar.gz"
        swift sdk install "$BUNDLE_URL" --checksum "$CHECKSUM"

        if [ "$BUNDLE" = "android" ]; then
          mkdir -p "$HOME/android-ndk"
          cd "$HOME/android-ndk"
          curl -fSLO "https://dl.google.com/android/repository/android-ndk-r27d-$(uname -s | tr '[:upper:]' '[:lower:]').zip"
          unzip -q android-ndk-r27d-*.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27d" >> "$GITHUB_ENV"

          SWIFT_SDKS_DIR=$(find "$HOME" -maxdepth 5 -type d -name swift-sdks 2>/dev/null | head -n 1)
          if [ -z "$SWIFT_SDKS_DIR" ]; then
            echo "Error: swift-sdks directory not found"
            exit 1
          fi
          cd "$(dirname "$SWIFT_SDKS_DIR")"
          ./swift-sdks/*_android.artifactbundle/swift-android/scripts/setup-android-sdk.sh
        fi
    - name: Build
      run: swift build -v --swift-sdk ${{ matrix.target.sdk }} ${{ matrix.target.build-option }}
